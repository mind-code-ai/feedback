name: Feature request
description: Something Mind Code should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The most persuasive requests describe a problem rather than a solution —
        it lets us find an answer you had not thought of.

        Please [search existing
        requests](https://github.com/mind-code-ai/feedback/issues?q=is%3Aissue+label%3Aenhancement)
        first. A reaction on an existing one counts for more than a duplicate.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The task, and what stops you today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
      description: Optional. If you have a specific shape in mind, describe it.
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: How you work around it now
      description: This tells us how much the gap costs you.
    validations:
      required: false
